[package]
name = "artisan"
version = "0.15.0"
description = "🧰 Artisan — a growing collection of handy Rust crates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["http", "client", "middleware", "plugin"]
categories = ["network-programming", "web-programming::http-client"]

[workspace]
members = ["artisan-*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/yansongda/artisan"

[features]
default = ["http"]
http = ["dep:artisan-http"]

[dependencies]
artisan-http = { path = "artisan-http", version = "0.15.0", optional = true }

[package.metadata.docs.rs]
all-features = true
